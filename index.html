<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PathWelder — Join Disconnected Cut Lines</title>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<style>
  :root {
    --bg: #1a1a2e; --surface: #16213e; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8;
    --accent2: #f472b6; --success: #4ade80; --warn: #fbbf24; --danger: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 1.4rem; font-weight: 600; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  header .subtitle { color: var(--muted); font-size: 0.85rem; }
  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
  .drop-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 60px 40px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--surface); margin-bottom: 24px; }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: rgba(56,189,248,0.05); }
  .drop-zone .icon { font-size: 3rem; margin-bottom: 12px; }
  .drop-zone .label { font-size: 1.1rem; }
  .drop-zone .hint { font-size: 0.85rem; color: var(--muted); margin-top: 8px; }
  .drop-zone input { display: none; }
  .stats-bar { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; flex: 1; min-width: 160px; }
  .stat-card .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-card .value { font-size: 1.8rem; font-weight: 700; margin-top: 4px; }
  .stat-card .detail { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .stat-card.before .value { color: var(--danger); }
  .stat-card.after .value { color: var(--success); }
  .stat-card.savings .value { color: var(--warn); }
  .canvas-area { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
  .canvas-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .canvas-panel .panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.red { background: var(--danger); } .dot.green { background: var(--success); }
  .canvas-panel svg { width: 100%; height: 500px; background: #0f0f1a; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 24px; }
  .btn { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.9rem; cursor: pointer; transition: all 0.15s; font-weight: 500; }
  .btn:hover { border-color: var(--accent); background: rgba(56,189,248,0.1); }
  .btn.primary { background: var(--accent); color: #000; border-color: var(--accent); }
  .btn.primary:hover { background: #7dd3fc; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .tolerance-control { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
  .tolerance-control input[type=range] { width: 120px; accent-color: var(--accent); }
  .tolerance-control .tol-value { color: var(--accent); font-weight: 600; min-width: 50px; }
  .log { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-top: 24px; max-height: 300px; overflow-y: auto; font-family: 'Cascadia Code','Fira Code',monospace; font-size: 0.8rem; line-height: 1.6; }
  .log .entry { color: var(--muted); } .log .entry.info { color: var(--accent); }
  .log .entry.success { color: var(--success); } .log .entry.warn { color: var(--warn); }
  .log .entry.error { color: var(--danger); }
  .hidden { display: none !important; }
  @media(max-width:900px) { .canvas-area { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><div>
  <h1>🔥 PathWelder</h1>
  <div class="subtitle">Join disconnected cut lines into continuous paths</div>
</div></header>
<div class="container">
  <div class="drop-zone" id="dropZone">
    <div class="icon">📐</div>
    <div class="label">Drop a PDF with die lines here</div>
    <div class="hint">or click to browse</div>
    <input type="file" accept=".pdf" id="fileInput">
  </div>
  <div id="resultsArea" class="hidden">
    <div class="stats-bar" id="statsBar"></div>
    <div class="controls">
      <div class="tolerance-control">
        <label>Join tolerance:</label>
        <input type="range" id="tolerance" min="0" max="5" step="0.1" value="0.5">
        <span class="tol-value" id="tolValue">0.5 pt</span>
      </div>
      <button class="btn" id="btnWeld" disabled>⚡ Weld Paths</button>
      <button class="btn primary" id="btnExport" disabled>💾 Export Welded PDF</button>
    </div>
    <div class="canvas-area">
      <div class="canvas-panel">
        <div class="panel-header"><span class="dot red"></span> Before — Disconnected Paths</div>
        <svg id="svgBefore" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="canvas-panel">
        <div class="panel-header"><span class="dot green"></span> After — Welded Paths</div>
        <svg id="svgAfter" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
  </div>
  <div class="log" id="log"></div>
</div>
<script>
const logEl=document.getElementById('log');
function log(m,c=''){const d=document.createElement('div');d.className='entry '+c;d.textContent=m;logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;}

let pdfBytes=null, parsedBlocks=[], weldedBlocks=[], pageMediaBox=null, currentFileName='';

/* ── PDF Stream Extraction ── */
function decompressStream(bytes){
  const proper=new Uint8Array(bytes);
  try{return pako.inflate(proper);}catch(e){try{return pako.inflateRaw(proper);}catch(e2){return null;}}
}
function findDrawingStream(bytes){
  const text=new TextDecoder('latin1').decode(bytes.slice(0));
  const re=/stream\r?\n/g; let m;
  while((m=re.exec(text))!==null){
    const si=m.index+m[0].length;
    if(m.index>=3&&text.substring(m.index-3,m.index)==='end')continue;
    const ei=text.indexOf('endstream',si); if(ei===-1)continue;
    let raw=bytes.slice(si,ei);
    while(raw.length>0&&(raw[raw.length-1]===0x0A||raw[raw.length-1]===0x0D))raw=raw.slice(0,-1);
    const dec=decompressStream(raw); if(!dec)continue;
    const decoded=new TextDecoder('latin1').decode(dec);
    if(decoded.trimStart().startsWith('%'))continue;
    if(/^S\s*$/m.test(decoded)&&/\d\s+m[\r\n]/.test(decoded))return decoded;
  }
  return null;
}

/* ── Path Parser ── */
function parsePathOps(text){
  const subs=[];let cur=[];
  for(const line of text.split('\n')){
    const t=line.trim();if(!t)continue;const p=t.split(/\s+/),op=p[p.length-1];
    if(op==='m'){if(cur.length)subs.push(cur);cur=[{op:'m',x:+p[0],y:+p[1]}];}
    else if(op==='l')cur.push({op:'l',x:+p[0],y:+p[1]});
    else if(op==='c')cur.push({op:'c',x1:+p[0],y1:+p[1],x2:+p[2],y2:+p[3],x:+p[4],y:+p[5]});
    else if(op==='h'&&cur.length)cur.push({op:'h',x:cur[0].x,y:cur[0].y});
  }
  if(cur.length)subs.push(cur);return subs;
}
function parseStream(st){
  const lines=st.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  const blocks=[];let pathLines=[],inPath=false,ctm={a:1,b:0,c:0,d:1,e:0,f:0},blockCTM=null,color='#fff',lw=1,layerName='Default';
  const PR=/^(-?\d[\d.]*\s+){1,6}[mlcvy]$/,RR=/^(-?\d[\d.]*\s+){3,4}re$/;
  for(let i=0;i<lines.length;i++){
    const t=lines[i].trim();
    const bdc=t.match(/^\/OC\s+(\/\w+)\s+BDC/);if(bdc)layerName=bdc[1].slice(1);
    const cm=t.match(/^q\s+([\d.-]+)\s+([\d.-]+)\s+([\d.-]+)\s+([\d.-]+)\s+([\d.-]+)\s+([\d.-]+)\s+cm$/);
    if(cm)ctm={a:+cm[1],b:+cm[2],c:+cm[3],d:+cm[4],e:+cm[5],f:+cm[6]};
    const km=t.match(/^([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+K$/);
    if(km){const[c,m2,y,k]=[+km[1],+km[2],+km[3],+km[4]];color=`rgb(${Math.round(255*(1-c)*(1-k))},${Math.round(255*(1-m2)*(1-k))},${Math.round(255*(1-y)*(1-k))})`;}
    if(/SCN$/.test(t))color='#ff00ff';
    const wm=t.match(/^([\d.]+)\s+w$/);if(wm)lw=+wm[1];
    const isPath=PR.test(t)||t==='h';let isClip=false;
    if(RR.test(t)){for(let j=i+1;j<lines.length;j++){const nt=lines[j].trim();if(!nt)continue;if(/^W\*?\s*(n)?$/.test(nt))isClip=true;break;}}
    if((isPath||(RR.test(t)&&!isClip))&&!isClip){if(!inPath)blockCTM={...ctm};inPath=true;pathLines.push(lines[i]);continue;}
    if(t==='S'&&inPath&&pathLines.length){blocks.push({subpaths:parsePathOps(pathLines.join('\n')),ctm:blockCTM,color,lineWidth:lw,layerName});pathLines=[];inPath=false;continue;}
    if(inPath&&pathLines.length){pathLines=[];inPath=false;}
  }
  return blocks;
}

/* ── Welding ── */
function gS(sp){return{x:sp[0].x,y:sp[0].y};}
function gE(sp){const l=sp[sp.length-1];return{x:l.x,y:l.y};}
function pD(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2);}
function revSP(segs){
  if(segs.length<=1)return[...segs];const e=gE(segs),r=[{op:'m',x:e.x,y:e.y}];
  for(let i=segs.length-1;i>=1;i--){const s=segs[i],p=segs[i-1];
    if(s.op==='c')r.push({op:'c',x1:s.x2,y1:s.y2,x2:s.x1,y2:s.y1,x:p.x,y:p.y});
    else r.push({op:'l',x:p.x,y:p.y});}return r;
}
function weldSP(subs,tol){
  const valid=subs.filter(s=>s.length>=2);if(valid.length<=1)return{welded:valid.length?valid:subs,joins:0};
  const paths=valid.map(s=>({segs:[...s],used:false}));const chains=[];let joins=0;
  while(true){const seed=paths.find(p=>!p.used);if(!seed)break;seed.used=true;let chain=[...seed.segs];let changed=true;
    while(changed){changed=false;const cs=gS(chain),ce=gE(chain);
      for(const p of paths){if(p.used)continue;const ps=gS(p.segs),pe=gE(p.segs);
        if(pD(ce,ps)<=tol){chain=chain.concat(p.segs.slice(1));p.used=true;changed=true;joins++;break;}
        if(pD(pe,cs)<=tol){chain=[...p.segs,...chain.slice(1)];p.used=true;changed=true;joins++;break;}
        if(pD(ce,pe)<=tol){chain=chain.concat(revSP(p.segs).slice(1));p.used=true;changed=true;joins++;break;}
        if(pD(ps,cs)<=tol){chain=[...revSP(p.segs),...chain.slice(1)];p.used=true;changed=true;joins++;break;}
      }}chains.push(chain);}return{welded:chains,joins};
}

/* ── SVG ── */
function renderPaths(svg,blocks,showNum){
  svg.innerHTML='';if(!pageMediaBox)return;
  const[mx,my,mw,mh]=pageMediaBox;svg.setAttribute('viewBox',`${mx} ${-mh} ${mw-mx} ${mh-my}`);svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  const colors=['#38bdf8','#f472b6','#4ade80','#fbbf24','#a78bfa','#fb923c','#e879f9','#22d3ee','#f97316','#84cc16'];
  blocks.forEach((bl,bi)=>{const ct=bl.ctm||{a:1,b:0,c:0,d:1,e:0,f:0};const tx=(x,y)=>({x:ct.a*x+ct.c*y+ct.e,y:ct.b*x+ct.d*y+ct.f});
    bl.subpaths.forEach((sp,si)=>{if(!sp.length)return;let d='';
      for(const s of sp){const p=tx(s.x,s.y);if(s.op==='m')d+=`M${p.x.toFixed(2)} ${(-p.y).toFixed(2)} `;
        else if(s.op==='l'||s.op==='h')d+=`L${p.x.toFixed(2)} ${(-p.y).toFixed(2)} `;
        else if(s.op==='c'){const p1=tx(s.x1,s.y1),p2=tx(s.x2,s.y2);d+=`C${p1.x.toFixed(2)} ${(-p1.y).toFixed(2)} ${p2.x.toFixed(2)} ${(-p2.y).toFixed(2)} ${p.x.toFixed(2)} ${(-p.y).toFixed(2)} `;}}
      if(!d.trim())return;const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',d);path.setAttribute('fill','none');
      path.setAttribute('stroke',showNum?colors[(bi*7+si)%colors.length]:(bl.color||'#fff'));path.setAttribute('stroke-width',showNum?'1.5':'1.2');svg.appendChild(path);
      if(showNum){const st=tx(sp[0].x,sp[0].y),en=tx(gE(sp).x,gE(sp).y);
        [[st,'#4ade80'],[en,'#f87171']].forEach(([pt,fill])=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',pt.x.toFixed(2));c.setAttribute('cy',(-pt.y).toFixed(2));c.setAttribute('r','3');c.setAttribute('fill',fill);svg.appendChild(c);});
        const mid=sp[Math.floor(sp.length/2)],mp=tx(mid.x,mid.y),lbl=document.createElementNS('http://www.w3.org/2000/svg','text');
        lbl.setAttribute('x',mp.x.toFixed(2));lbl.setAttribute('y',(-(mp.y)+8).toFixed(2));lbl.setAttribute('fill',colors[(bi*7+si)%colors.length]);lbl.setAttribute('font-size','8');lbl.setAttribute('text-anchor','middle');lbl.textContent=`${bi}.${si}`;svg.appendChild(lbl);}
    });});
}

/* ── PDF Export ── */
function fmt(n){const s=n.toFixed(4);return s.replace(/\.?0+$/,'')||'0';}

async function exportWeldedPDF(){
  if(!pdfBytes||!weldedBlocks.length)return;
  log('Building welded PDF...','info');
  const origStream=findDrawingStream(pdfBytes);
  if(!origStream){log('Error: drawing stream not found','error');return;}

  /* Rebuild stream content with welded paths */
  const origLines=origStream.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  const PR=/^(-?\d[\d.]*\s+){1,6}[mlcvy]$/,RR=/^(-?\d[\d.]*\s+){3,4}re$/;
  const types=origLines.map((line,idx)=>{const t=line.trim();if(!t)return'empty';if(PR.test(t)||t==='h')return'path';if(t==='S')return'stroke';
    if(RR.test(t)){for(let j=idx+1;j<origLines.length;j++){const nt=origLines[j].trim();if(!nt)continue;if(/^W\*?\s*(n)?$/.test(nt))return'clip';break;}return'path';}return'other';});
  const wTexts=weldedBlocks.map(bl=>{const ls=[];bl.subpaths.forEach(sp=>sp.forEach(s=>{
    if(s.op==='m')ls.push(`${fmt(s.x)} ${fmt(s.y)} m`);else if(s.op==='l')ls.push(`${fmt(s.x)} ${fmt(s.y)} l`);
    else if(s.op==='h')ls.push('h');else if(s.op==='c')ls.push(`${fmt(s.x1)} ${fmt(s.y1)} ${fmt(s.x2)} ${fmt(s.y2)} ${fmt(s.x)} ${fmt(s.y)} c`);}));return ls.join('\n');});
  const result=[...origLines];let sIdx=0;
  for(let i=0;i<types.length;i++){if(types[i]!=='stroke')continue;let ps=i;
    for(let j=i-1;j>=0;j--){if(types[j]==='path')ps=j;else if(types[j]==='empty')continue;else break;}
    if(ps<i&&sIdx<wTexts.length){for(let j=ps;j<i;j++)result[j]=null;result[ps]=wTexts[sIdx];log(`  Replaced stroke block ${sIdx}`,'success');}sIdx++;}
  const newStream=result.filter(l=>l!==null).join('\n');
  const om=(origStream.match(/[\d.]+\s+[\d.-]+\s+m/g)||[]).length;
  const nm=(newStream.match(/[\d.]+\s+[\d.-]+\s+m/g)||[]).length;
  log(`Moveto ops: ${om} → ${nm}`,om!==nm?'success':'warn');

  /* Use pdf-lib to properly write the new PDF */
  const doc=await PDFLib.PDFDocument.load(pdfBytes.slice(0),{ignoreEncryption:true});
  const page=doc.getPages()[0];

  /* Find and replace the drawing content stream */
  const contentsVal=page.node.get(PDFLib.PDFName.of('Contents'));
  const refs=[];
  if(contentsVal instanceof PDFLib.PDFArray){for(let i=0;i<contentsVal.size();i++)refs.push({ref:contentsVal.get(i),idx:i});}
  else refs.push({ref:contentsVal,idx:-1});
  let replaced=false;
  for(const{ref,idx}of refs){
    const obj=doc.context.lookup(ref);if(!obj)continue;
    try{const raw=obj.getContents();const dec=decompressStream(new Uint8Array(raw));
      if(!dec)continue;const t=new TextDecoder('latin1').decode(dec);
      if(/^S\s*$/m.test(t)&&/\d\s+m[\r\n]/.test(t)&&!t.trimStart().startsWith('%')){
        const newBytes=new TextEncoder().encode(newStream);
        const ns=doc.context.flateStream(newBytes);const nr=doc.context.register(ns);
        if(contentsVal instanceof PDFLib.PDFArray)contentsVal.set(idx,nr);
        else page.node.set(PDFLib.PDFName.of('Contents'),nr);
        replaced=true;log('Content stream replaced','success');break;
      }}catch(e){continue;}}
  if(!replaced){log('Error: could not replace stream','error');return;}

  /* Strip Illustrator private roundtrip data */
  const pi=page.node.get(PDFLib.PDFName.of('PieceInfo'));
  if(pi){page.node.delete(PDFLib.PDFName.of('PieceInfo'));log('Stripped Illustrator private data','success');}

  const saved=await doc.save({useObjectStreams:false});
  const blob=new Blob([saved],{type:'application/pdf'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='welded_'+(currentFileName||'output')+'.pdf';a.click();URL.revokeObjectURL(url);
  log(`Exported: ${a.download} (${saved.length} bytes)`,'success');
}

/* ── UI ── */
const dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput');
const resultsArea=document.getElementById('resultsArea'),statsBar=document.getElementById('statsBar');
const tolSlider=document.getElementById('tolerance'),tolValue=document.getElementById('tolValue');
const btnWeld=document.getElementById('btnWeld'),btnExport=document.getElementById('btnExport');
dropZone.addEventListener('click',()=>fileInput.click());
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('dragover');});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('dragover');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);});
fileInput.addEventListener('change',e=>{if(e.target.files.length)handleFile(e.target.files[0]);});
tolSlider.addEventListener('input',()=>{tolValue.textContent=`${tolSlider.value} pt`;});
btnWeld.addEventListener('click',runWeld);
btnExport.addEventListener('click',exportWeldedPDF);

async function handleFile(file){
  currentFileName=file.name.replace(/\.pdf$/i,'');
  log(`Loading: ${file.name}`,'info');
  pdfBytes=new Uint8Array(await file.arrayBuffer());parsePDF();
}
function parsePDF(){
  const text=new TextDecoder('latin1').decode(pdfBytes.slice(0));
  const mb=text.match(/\/MediaBox\s*\[\s*([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s*\]/);
  pageMediaBox=mb?mb.slice(1,5).map(Number):[0,0,612,792];
  log(`Page: ${pageMediaBox[2]}×${pageMediaBox[3]} pt`,'info');
  const stream=findDrawingStream(pdfBytes);
  if(!stream){log('No vector content found!','error');return;}
  log(`Drawing stream: ${stream.length} chars`,'success');
  parsedBlocks=parseStream(stream);let total=0;
  parsedBlocks.forEach(b=>{total+=b.subpaths.length;log(`  ${b.layerName}: ${b.subpaths.length} subpaths, ${b.lineWidth}pt`,'');});
  resultsArea.classList.remove('hidden');dropZone.classList.add('hidden');
  renderPaths(document.getElementById('svgBefore'),parsedBlocks,true);
  document.getElementById('svgAfter').innerHTML='<text x="50%" y="50%" text-anchor="middle" fill="#666" font-size="14">Click "Weld Paths"</text>';
  updateStats(total,0,0);btnWeld.disabled=false;btnExport.disabled=true;
}
function updateStats(b,a,j){
  statsBar.innerHTML=`<div class="stat-card before"><div class="label">Before</div><div class="value">${b}</div><div class="detail">subpaths</div></div>
  <div class="stat-card after"><div class="label">After</div><div class="value">${a||'—'}</div><div class="detail">continuous paths</div></div>
  <div class="stat-card savings"><div class="label">Lifts Eliminated</div><div class="value">${j||'—'}</div><div class="detail">fewer movements</div></div>`;
}
function runWeld(){
  const tol=parseFloat(tolSlider.value);log(`Welding with tolerance ${tol} pt...`,'info');
  weldedBlocks=[];let tB=0,tA=0,tJ=0;
  for(const bl of parsedBlocks){tB+=bl.subpaths.length;const{welded,joins}=weldSP(bl.subpaths,tol);
    weldedBlocks.push({...bl,subpaths:welded});tA+=welded.length;tJ+=joins;
    log(`  ${bl.layerName}: ${bl.subpaths.length} → ${welded.length} (${joins} joins)`,'success');}
  log(`Total: ${tB} → ${tA}, ${tJ} lifts eliminated`,'success');
  updateStats(tB,tA,tJ);renderPaths(document.getElementById('svgAfter'),weldedBlocks,true);btnExport.disabled=false;
}
</script>
</body>
</html>
