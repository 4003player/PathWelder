<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PathWelder — Join Disconnected Cut Lines</title>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<style>
  :root{--bg:#1a1a2e;--surface:#16213e;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--accent2:#f472b6;--success:#4ade80;--warn:#fbbf24;--danger:#f87171}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px}
  header h1{font-size:1.4rem;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  header .subtitle{color:var(--muted);font-size:.85rem}
  .container{max-width:1400px;margin:0 auto;padding:24px}
  .drop-zone{border:2px dashed var(--border);border-radius:12px;padding:60px 40px;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface);margin-bottom:24px}
  .drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:rgba(56,189,248,.05)}
  .drop-zone .icon{font-size:3rem;margin-bottom:12px}.drop-zone .label{font-size:1.1rem}
  .drop-zone .hint{font-size:.85rem;color:var(--muted);margin-top:8px}.drop-zone input{display:none}
  .stats-bar{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 20px;flex:1;min-width:160px}
  .stat-card .label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .stat-card .value{font-size:1.8rem;font-weight:700;margin-top:4px}
  .stat-card .detail{font-size:.8rem;color:var(--muted);margin-top:2px}
  .stat-card.before .value{color:var(--danger)}.stat-card.after .value{color:var(--success)}.stat-card.savings .value{color:var(--warn)}
  .canvas-area{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
  .canvas-panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .canvas-panel .panel-header{padding:12px 16px;border-bottom:1px solid var(--border);font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}.dot.red{background:var(--danger)}.dot.green{background:var(--success)}
  .canvas-panel svg{width:100%;height:500px;background:#0f0f1a}
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
  .btn{padding:10px 20px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.9rem;cursor:pointer;transition:all .15s;font-weight:500}
  .btn:hover{border-color:var(--accent);background:rgba(56,189,248,.1)}
  .btn.primary{background:var(--accent);color:#000;border-color:var(--accent)}.btn.primary:hover{background:#7dd3fc}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .tolerance-control{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
  .tolerance-control input[type=range]{width:120px;accent-color:var(--accent)}
  .tolerance-control .tol-value{color:var(--accent);font-weight:600;min-width:50px}
  .log{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:24px;max-height:300px;overflow-y:auto;font-family:'Cascadia Code','Fira Code',monospace;font-size:.8rem;line-height:1.6}
  .log .entry{color:var(--muted)}.log .entry.info{color:var(--accent)}.log .entry.success{color:var(--success)}.log .entry.warn{color:var(--warn)}.log .entry.error{color:var(--danger)}
  .hidden{display:none!important}
  @media(max-width:900px){.canvas-area{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><h1>🔥 PathWelder</h1><div class="subtitle">Join disconnected cut lines into continuous paths</div></div></header>
<div class="container">
  <div class="drop-zone" id="dropZone">
    <div class="icon">📐</div><div class="label">Drop a PDF with die lines here</div>
    <div class="hint">or click to browse</div><input type="file" accept=".pdf" id="fileInput">
  </div>
  <div id="resultsArea" class="hidden">
    <div class="stats-bar" id="statsBar"></div>
    <div class="controls">
      <div class="tolerance-control">
        <label>Join tolerance:</label>
        <input type="range" id="tolerance" min="0" max="5" step="0.05" value="0.5">
        <span class="tol-value" id="tolValue">0.50 pt</span>
      </div>
      <button class="btn" id="btnWeld" disabled>⚡ Weld Paths</button>
      <button class="btn primary" id="btnExport" disabled>💾 Export Welded PDF</button>
    </div>
    <div class="canvas-area">
      <div class="canvas-panel"><div class="panel-header"><span class="dot red"></span> Before — Disconnected</div><svg id="svgBefore" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="canvas-panel"><div class="panel-header"><span class="dot green"></span> After — Welded</div><svg id="svgAfter" xmlns="http://www.w3.org/2000/svg"></svg></div>
    </div>
  </div>
  <div class="log" id="log"></div>
</div>
<script>
/* ════════════════════════════════════════════
   PathWelder – browser port of Grok's die_path_joiner.py
   ════════════════════════════════════════════ */

const logEl = document.getElementById('log');
function log(m, c = '') {
  const d = document.createElement('div');
  d.className = 'entry ' + c; d.textContent = m;
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
}

let pdfBytes = null, currentFileName = '';
let pageWidth = 0, pageHeight = 0;
let solidSegs = [], dashedSegs = [], regMarks = [];
let joinedChains = [];

/* ── Decompress a PDF stream (pako, strip trailing EOL) ── */
function decompressStream(bytes) {
  const p = new Uint8Array(bytes);
  try { return pako.inflate(p); } catch (e) {
    try { return pako.inflateRaw(p); } catch (e2) { return null; }
  }
}

/* ── Extract the drawing content stream text from raw PDF bytes ── */
function getContentStream(bytes) {
  const text = new TextDecoder('latin1').decode(bytes.slice(0));
  const re = /stream\r?\n/g; let m;
  while ((m = re.exec(text)) !== null) {
    const si = m.index + m[0].length;
    if (m.index >= 3 && text.substring(m.index - 3, m.index) === 'end') continue;
    const ei = text.indexOf('endstream', si); if (ei === -1) continue;
    let raw = bytes.slice(si, ei);
    while (raw.length > 0 && (raw[raw.length - 1] === 0x0A || raw[raw.length - 1] === 0x0D))
      raw = raw.slice(0, -1);
    const dec = decompressStream(raw); if (!dec) continue;
    const decoded = new TextDecoder('latin1').decode(dec);
    if (decoded.trimStart().startsWith('%')) continue;
    if (/^[Sf]\s*$/m.test(decoded) && /\d\s+m[\r\n]/.test(decoded)) return decoded;
  }
  return null;
}

/* ══════════════════════════════════════
   Direct port of Grok's parse / join logic
   ══════════════════════════════════════ */

/* Parse q 1 0 0 1 tx ty cm … S Q blocks into absolute-coordinate segments */
function parseContentStream(data) {
  const segments = [];
  const blockRe = /q\s+1\s+0\s+0\s+1\s+([-\d.]+)\s+([-\d.]+)\s+cm\s+(.*?)\s+S\s+Q/gs;
  let bm;
  while ((bm = blockRe.exec(data)) !== null) {
    const tx = parseFloat(bm[1]), ty = parseFloat(bm[2]);
    const body = bm[3];
    const pts = [];
    // Collect points in order of appearance
    const opRe = /([-\d.]+)\s+([-\d.]+)\s+m|([-\d.]+)\s+([-\d.]+)\s+l|([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+c/g;
    let om;
    while ((om = opRe.exec(body)) !== null) {
      if (om[1] !== undefined) // moveTo
        pts.push([tx + parseFloat(om[1]), ty + parseFloat(om[2])]);
      else if (om[3] !== undefined) // lineTo
        pts.push([tx + parseFloat(om[3]), ty + parseFloat(om[4])]);
      else if (om[5] !== undefined) // curveTo – keep endpoint
        pts.push([tx + parseFloat(om[9]), ty + parseFloat(om[10])]);
    }
    if (pts.length >= 2) segments.push(pts);
  }
  return segments;
}

/* Also parse paths inside a single shared CTM block (shallowbox pattern):
   q 1 0 0 1 tx ty cm
     x y m  x y l … x y m  x y l … (multiple subpaths)
   S
   Q
   Split on moveTo to get individual segments. */
function parseSharedCTMBlock(data) {
  const segments = [];
  // Match blocks with a single S that contain multiple m operators
  const blockRe = /q\s+1\s+0\s+0\s+1\s+([-\d.]+)\s+([-\d.]+)\s+cm\s+(.*?)\s+S\s/gs;
  let bm;
  while ((bm = blockRe.exec(data)) !== null) {
    const tx = parseFloat(bm[1]), ty = parseFloat(bm[2]);
    const body = bm[3];
    // Count moveto ops — if >1, split into subpaths
    const mCount = (body.match(/([-\d.]+)\s+([-\d.]+)\s+m/g) || []).length;
    if (mCount <= 1) continue; // already handled by parseContentStream

    let curSeg = [];
    const opRe = /([-\d.]+)\s+([-\d.]+)\s+m|([-\d.]+)\s+([-\d.]+)\s+l|([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+c/g;
    let om;
    while ((om = opRe.exec(body)) !== null) {
      if (om[1] !== undefined) { // moveTo — start new segment
        if (curSeg.length >= 2) segments.push(curSeg);
        curSeg = [[tx + parseFloat(om[1]), ty + parseFloat(om[2])]];
      } else if (om[3] !== undefined) { // lineTo
        curSeg.push([tx + parseFloat(om[3]), ty + parseFloat(om[4])]);
      } else if (om[5] !== undefined) { // curveTo
        curSeg.push([tx + parseFloat(om[9]), ty + parseFloat(om[10])]);
      }
    }
    if (curSeg.length >= 2) segments.push(curSeg);
  }
  return segments;
}

/* Extract registration mark centres (filled circles) */
function extractRegMarks(data) {
  const marks = [];
  const re = /q\s+1\s+0\s+0\s+1\s+([-\d.]+)\s+([-\d.]+)\s+cm\s+.*?f\s+Q/gs;
  let m;
  while ((m = re.exec(data)) !== null)
    marks.push([parseFloat(m[1]), parseFloat(m[2])]);
  return marks;
}

/* Join segments that share endpoints (Grok's algorithm) */
function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }

function ptKey(p, tol) {
  return `${Math.round(p[0] / tol) * tol},${Math.round(p[1] / tol) * tol}`;
}

function joinSegments(segments, tol = 0.05) {
  if (!segments.length) return [];
  const ends = new Map();
  segments.forEach((seg, i) => {
    const addK = (p, isStart) => {
      const k = ptKey(p, tol);
      if (!ends.has(k)) ends.set(k, []);
      ends.get(k).push({ idx: i, isStart });
    };
    addK(seg[0], true);
    addK(seg[seg.length - 1], false);
  });

  const used = new Set();
  const chains = [];

  for (let i = 0; i < segments.length; i++) {
    if (used.has(i)) continue;
    const chain = [segments[i].slice()];
    used.add(i);

    // Grow forward
    while (true) {
      const endPt = chain[chain.length - 1][chain[chain.length - 1].length - 1];
      const cands = ends.get(ptKey(endPt, tol)) || [];
      const nxt = cands.find(c => !used.has(c.idx));
      if (!nxt) break;
      const seg = segments[nxt.idx];
      chain.push(nxt.isStart ? seg.slice() : seg.slice().reverse());
      used.add(nxt.idx);
    }

    // Grow backward
    while (true) {
      const startPt = chain[0][0];
      const cands = ends.get(ptKey(startPt, tol)) || [];
      const prv = cands.find(c => !used.has(c.idx));
      if (!prv) break;
      const seg = segments[prv.idx];
      chain.unshift(!prv.isStart ? seg.slice() : seg.slice().reverse());
      used.add(prv.idx);
    }

    // Flatten, dropping duplicate join points
    const flat = [];
    chain.forEach((piece, k) => {
      if (k === 0) flat.push(...piece);
      else flat.push(...piece.slice(1));
    });
    chains.push(flat);
  }
  return chains;
}

/* ══════════════════════════════════════
   SVG rendering
   ══════════════════════════════════════ */
function renderSVG(svg, polylines, marks, opts = {}) {
  svg.innerHTML = '';
  if (!pageWidth) return;
  svg.setAttribute('viewBox', `0 ${-pageHeight} ${pageWidth} ${pageHeight}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  const colors = ['#38bdf8','#f472b6','#4ade80','#fbbf24','#a78bfa','#fb923c','#e879f9','#22d3ee','#f97316','#84cc16'];

  polylines.forEach((pts, i) => {
    if (pts.length < 2) return;
    let d = `M${pts[0][0].toFixed(2)} ${(-pts[0][1]).toFixed(2)}`;
    for (let j = 1; j < pts.length; j++)
      d += ` L${pts[j][0].toFixed(2)} ${(-pts[j][1]).toFixed(2)}`;
    if (dist(pts[0], pts[pts.length - 1]) < 1.5) d += ' Z';
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d); path.setAttribute('fill', 'none');
    path.setAttribute('stroke', opts.numbered ? colors[i % colors.length] : '#e84060');
    path.setAttribute('stroke-width', '1.2');
    if (opts.dashed && opts.dashed.has(i)) path.setAttribute('stroke-dasharray', '8 4');
    svg.appendChild(path);

    if (opts.numbered) {
      // Start/end dots
      const s = pts[0], e = pts[pts.length - 1];
      for (const [pt, fill] of [[s, '#4ade80'], [e, '#f87171']]) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', pt[0].toFixed(2)); c.setAttribute('cy', (-pt[1]).toFixed(2));
        c.setAttribute('r', '3'); c.setAttribute('fill', fill); svg.appendChild(c);
      }
      const mid = pts[Math.floor(pts.length / 2)];
      const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      lbl.setAttribute('x', mid[0].toFixed(2)); lbl.setAttribute('y', (-mid[1] + 8).toFixed(2));
      lbl.setAttribute('fill', colors[i % colors.length]); lbl.setAttribute('font-size', '8');
      lbl.setAttribute('text-anchor', 'middle'); lbl.textContent = String(i); svg.appendChild(lbl);
    }
  });

  // Registration marks
  for (const [mx, my] of marks) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', mx.toFixed(2)); c.setAttribute('cy', (-my).toFixed(2));
    c.setAttribute('r', '6'); c.setAttribute('fill', '#888'); c.setAttribute('opacity', '0.5');
    svg.appendChild(c);
  }
}

/* ══════════════════════════════════════
   PDF export — build from scratch with pdf-lib (like reportlab)
   ══════════════════════════════════════ */
async function exportWeldedPDF() {
  if (!joinedChains.length && !dashedSegs.length) return;
  log('Building welded PDF...', 'info');

  const doc = await PDFLib.PDFDocument.create();
  const page = doc.addPage([pageWidth, pageHeight]);

  // Registration marks (black filled circles)
  for (const [mx, my] of regMarks) {
    page.drawCircle({ x: mx, y: my, size: 9,
      color: PDFLib.rgb(0, 0, 0), borderWidth: 0 });
  }

  // Joined outlines (red stroked paths)
  for (const pts of joinedChains) {
    if (pts.length < 2) continue;
    // Skip tiny shapes (likely reg mark outlines)
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    if (Math.max(...xs) - Math.min(...xs) < 30 && Math.max(...ys) - Math.min(...ys) < 30) continue;

    const closed = dist(pts[0], pts[pts.length - 1]) < 1.5;

    // Build the path as raw PDF operators
    const ops = [];
    ops.push(`${f(pts[0][0])} ${f(pts[0][1])} m`);
    for (let i = 1; i < pts.length; i++)
      ops.push(`${f(pts[i][0])} ${f(pts[i][1])} l`);
    if (closed) ops.push('h');
    ops.push('S');

    // Wrap in graphics state
    const stream = [
      'q',
      '0.85 0.05 0.05 RG',  // red stroke
      '0.72 w',              // line width
      '1 j 1 J',             // round join + cap
      ...ops,
      'Q'
    ].join('\n');

    // Append to page content
    const streamBytes = new Uint8Array(stream.length);
    for (let i = 0; i < stream.length; i++) streamBytes[i] = stream.charCodeAt(i) & 0xFF;
    const ref = doc.context.register(doc.context.flateStream(streamBytes));
    const existing = page.node.get(PDFLib.PDFName.of('Contents'));
    if (existing instanceof PDFLib.PDFArray) {
      existing.push(ref);
    } else {
      const arr = doc.context.obj([existing, ref]);
      page.node.set(PDFLib.PDFName.of('Contents'), arr);
    }
  }

  // Dashed lines (green)
  if (dashedSegs.length) {
    const dOps = ['q', '0 0.45 0 RG', '0.72 w', '[18 9] 0 d'];
    for (const seg of dashedSegs) {
      if (seg.length >= 2) {
        dOps.push(`${f(seg[0][0])} ${f(seg[0][1])} m`);
        for (let i = 1; i < seg.length; i++)
          dOps.push(`${f(seg[i][0])} ${f(seg[i][1])} l`);
        dOps.push('S');
      }
    }
    dOps.push('Q');
    const dStream = dOps.join('\n');
    const dBytes = new Uint8Array(dStream.length);
    for (let i = 0; i < dStream.length; i++) dBytes[i] = dStream.charCodeAt(i) & 0xFF;
    const dRef = doc.context.register(doc.context.flateStream(dBytes));
    const ex = page.node.get(PDFLib.PDFName.of('Contents'));
    if (ex instanceof PDFLib.PDFArray) ex.push(dRef);
    else {
      const arr = doc.context.obj([ex, dRef]);
      page.node.set(PDFLib.PDFName.of('Contents'), arr);
    }
  }

  const saved = await doc.save({ useObjectStreams: false });
  const blob = new Blob([saved], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = 'welded_' + (currentFileName || 'output') + '.pdf';
  a.click(); URL.revokeObjectURL(url);
  log(`Exported: ${a.download} (${saved.length} bytes)`, 'success');
}

function f(n) { const s = n.toFixed(4); return s.replace(/\.?0+$/, '') || '0'; }

/* ══════════════════════════════════════
   UI wiring
   ══════════════════════════════════════ */
const dropZone = document.getElementById('dropZone'), fileInput = document.getElementById('fileInput');
const resultsArea = document.getElementById('resultsArea'), statsBar = document.getElementById('statsBar');
const tolSlider = document.getElementById('tolerance'), tolValueEl = document.getElementById('tolValue');
const btnWeld = document.getElementById('btnWeld'), btnExport = document.getElementById('btnExport');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e => { if (e.target.files.length) handleFile(e.target.files[0]); });
tolSlider.addEventListener('input', () => { tolValueEl.textContent = `${parseFloat(tolSlider.value).toFixed(2)} pt`; });
btnWeld.addEventListener('click', runWeld);
btnExport.addEventListener('click', exportWeldedPDF);

async function handleFile(file) {
  currentFileName = file.name.replace(/\.pdf$/i, '');
  log(`Loading: ${file.name}`, 'info');
  pdfBytes = new Uint8Array(await file.arrayBuffer());
  parsePDF();
}

function parsePDF() {
  // Get page dimensions
  const text = new TextDecoder('latin1').decode(pdfBytes.slice(0));
  const mb = text.match(/\/MediaBox\s*\[\s*([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s*\]/);
  if (mb) { pageWidth = parseFloat(mb[3]); pageHeight = parseFloat(mb[4]); }
  else { pageWidth = 612; pageHeight = 792; }
  log(`Page: ${pageWidth} × ${pageHeight} pt (${(pageWidth/72).toFixed(1)} × ${(pageHeight/72).toFixed(1)} in)`, 'info');

  // Get content stream
  const stream = getContentStream(pdfBytes);
  if (!stream) { log('No vector content found!', 'error'); return; }
  log(`Content stream: ${stream.length} chars`, 'success');

  // Split solid vs dashed (same heuristic as Grok's script)
  let solidPart = stream, dashedPart = '';
  const csIdx = stream.indexOf('/CS2');
  if (csIdx >= 0) { solidPart = stream.substring(0, csIdx); dashedPart = stream.substring(csIdx); }

  // Parse segments — try both patterns
  solidSegs = parseContentStream(solidPart);
  const sharedSegs = parseSharedCTMBlock(solidPart);
  if (sharedSegs.length > solidSegs.length) {
    log(`  Using shared-CTM parser (${sharedSegs.length} segments)`, 'info');
    solidSegs = sharedSegs;
  } else {
    log(`  Using per-block parser (${solidSegs.length} segments)`, 'info');
  }

  dashedSegs = parseContentStream(dashedPart);
  regMarks = extractRegMarks(stream);

  log(`  ${solidSegs.length} solid segment(s), ${dashedSegs.length} dashed, ${regMarks.length} reg mark(s)`, 'info');

  resultsArea.classList.remove('hidden');
  dropZone.classList.add('hidden');

  // Render before view
  const allBefore = [...solidSegs, ...dashedSegs];
  const dashedSet = new Set();
  for (let i = solidSegs.length; i < allBefore.length; i++) dashedSet.add(i);
  renderSVG(document.getElementById('svgBefore'), allBefore, regMarks, { numbered: true, dashed: dashedSet });
  document.getElementById('svgAfter').innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#666" font-size="14">Click "Weld Paths"</text>';
  updateStats(solidSegs.length, 0, 0);
  btnWeld.disabled = false; btnExport.disabled = true;
}

function updateStats(b, a, j) {
  statsBar.innerHTML = `
    <div class="stat-card before"><div class="label">Before</div><div class="value">${b}</div><div class="detail">segments</div></div>
    <div class="stat-card after"><div class="label">After</div><div class="value">${a || '—'}</div><div class="detail">continuous paths</div></div>
    <div class="stat-card savings"><div class="label">Joins</div><div class="value">${j || '—'}</div><div class="detail">segments connected</div></div>`;
}

function runWeld() {
  const tol = parseFloat(tolSlider.value);
  log(`Welding with tolerance ${tol} pt...`, 'info');
  joinedChains = joinSegments(solidSegs, tol);
  const joins = solidSegs.length - joinedChains.length;
  log(`  ${solidSegs.length} segments → ${joinedChains.length} path(s) (${joins} joins)`, 'success');
  joinedChains.forEach((ch, i) => {
    const closed = dist(ch[0], ch[ch.length - 1]) < 1.5;
    if (closed) log(`    Path ${i}: CLOSED loop (${ch.length} points)`, 'success');
  });
  updateStats(solidSegs.length, joinedChains.length + dashedSegs.length, joins);

  // Render after
  const allAfter = [...joinedChains, ...dashedSegs];
  const dSet = new Set();
  for (let i = joinedChains.length; i < allAfter.length; i++) dSet.add(i);
  renderSVG(document.getElementById('svgAfter'), allAfter, regMarks, { numbered: true, dashed: dSet });
  btnExport.disabled = false;
}

/* Auto-load */
const params = new URLSearchParams(window.location.search);
const autoFile = params.get('file');
if (autoFile) {
  log(`Auto-loading: ${autoFile}`, 'info');
  (async () => { try {
    const r = await fetch(autoFile); if (!r.ok) throw new Error(`HTTP ${r.status}`);
    currentFileName = autoFile.split('/').pop().replace(/\.pdf$/i, '');
    pdfBytes = new Uint8Array(await r.arrayBuffer()); parsePDF();
  } catch (e) { log(`Auto-load failed: ${e.message}`, 'error'); } })();
}
</script>
