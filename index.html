<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PathWelder — Join Disconnected Cut Lines</title>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<style>
  :root { --bg:#1a1a2e;--surface:#16213e;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--accent2:#f472b6;--success:#4ade80;--warn:#fbbf24;--danger:#f87171; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px}
  header h1{font-size:1.4rem;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  header .subtitle{color:var(--muted);font-size:.85rem}
  .container{max-width:1400px;margin:0 auto;padding:24px}
  .drop-zone{border:2px dashed var(--border);border-radius:12px;padding:60px 40px;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface);margin-bottom:24px}
  .drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:rgba(56,189,248,.05)}
  .drop-zone .icon{font-size:3rem;margin-bottom:12px}.drop-zone .label{font-size:1.1rem}
  .drop-zone .hint{font-size:.85rem;color:var(--muted);margin-top:8px}.drop-zone input{display:none}
  .stats-bar{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 20px;flex:1;min-width:160px}
  .stat-card .label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .stat-card .value{font-size:1.8rem;font-weight:700;margin-top:4px}
  .stat-card .detail{font-size:.8rem;color:var(--muted);margin-top:2px}
  .stat-card.before .value{color:var(--danger)}.stat-card.after .value{color:var(--success)}.stat-card.savings .value{color:var(--warn)}
  .canvas-area{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
  .canvas-panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .canvas-panel .panel-header{padding:12px 16px;border-bottom:1px solid var(--border);font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}.dot.red{background:var(--danger)}.dot.green{background:var(--success)}
  .canvas-panel svg{width:100%;height:500px;background:#0f0f1a}
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
  .btn{padding:10px 20px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.9rem;cursor:pointer;transition:all .15s;font-weight:500}
  .btn:hover{border-color:var(--accent);background:rgba(56,189,248,.1)}
  .btn.primary{background:var(--accent);color:#000;border-color:var(--accent)}.btn.primary:hover{background:#7dd3fc}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .tolerance-control{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
  .tolerance-control input[type=range]{width:120px;accent-color:var(--accent)}
  .tolerance-control .tol-value{color:var(--accent);font-weight:600;min-width:50px}
  .log{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:24px;max-height:300px;overflow-y:auto;font-family:'Cascadia Code','Fira Code',monospace;font-size:.8rem;line-height:1.6}
  .log .entry{color:var(--muted)}.log .entry.info{color:var(--accent)}.log .entry.success{color:var(--success)}.log .entry.warn{color:var(--warn)}.log .entry.error{color:var(--danger)}
  .hidden{display:none!important}
  @media(max-width:900px){.canvas-area{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><h1>🔥 PathWelder</h1><div class="subtitle">Join disconnected cut lines into continuous paths</div></div></header>
<div class="container">
  <div class="drop-zone" id="dropZone">
    <div class="icon">📐</div><div class="label">Drop a PDF with die lines here</div>
    <div class="hint">or click to browse</div><input type="file" accept=".pdf" id="fileInput">
  </div>
  <div id="resultsArea" class="hidden">
    <div class="stats-bar" id="statsBar"></div>
    <div class="controls">
      <div class="tolerance-control">
        <label>Join tolerance:</label>
        <input type="range" id="tolerance" min="0" max="5" step="0.1" value="0.5">
        <span class="tol-value" id="tolValue">0.5 pt</span>
      </div>
      <button class="btn" id="btnWeld" disabled>⚡ Weld Paths</button>
      <button class="btn primary" id="btnExport" disabled>💾 Export Welded PDF</button>
    </div>
    <div class="canvas-area">
      <div class="canvas-panel"><div class="panel-header"><span class="dot red"></span> Before — Disconnected Paths</div><svg id="svgBefore" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="canvas-panel"><div class="panel-header"><span class="dot green"></span> After — Welded Paths</div><svg id="svgAfter" xmlns="http://www.w3.org/2000/svg"></svg></div>
    </div>
  </div>
  <div class="log" id="log"></div>
</div>
<script>
const logEl=document.getElementById('log');
function log(m,c=''){const d=document.createElement('div');d.className='entry '+c;d.textContent=m;logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;}

let pdfBytes=null, origStreamText='', pageMediaBox=null, currentFileName='';
let parsedSegments=[]; // [{absPoints, ctm, color, lineWidth, layerName, isFill, isDashed, origPathText}]
let weldedChains=[];   // [{absPoints, color, lineWidth, layerName, closed}]
let unweldedSegs=[];    // segments that didn't join (fills, dashes, singletons)

/* ── Decompress ── */
function decompressStream(bytes){
  const p=new Uint8Array(bytes);
  try{return pako.inflate(p);}catch(e){try{return pako.inflateRaw(p);}catch(e2){return null;}}
}

/* ── Find drawing stream ── */
function findDrawingStream(bytes){
  const text=new TextDecoder('latin1').decode(bytes.slice(0));
  const re=/stream\r?\n/g;let m;
  while((m=re.exec(text))!==null){
    const si=m.index+m[0].length;
    if(m.index>=3&&text.substring(m.index-3,m.index)==='end')continue;
    const ei=text.indexOf('endstream',si);if(ei===-1)continue;
    let raw=bytes.slice(si,ei);
    while(raw.length>0&&(raw[raw.length-1]===0x0A||raw[raw.length-1]===0x0D))raw=raw.slice(0,-1);
    const dec=decompressStream(raw);if(!dec)continue;
    const decoded=new TextDecoder('latin1').decode(dec);
    if(decoded.trimStart().startsWith('%'))continue;
    if(/^[Sf]\s*$/m.test(decoded)&&/\d\s+m[\r\n]/.test(decoded))return decoded;
  }
  return null;
}

/* ── CTM math ── */
function mulCTM(a,b){return{a:a.a*b.a+a.b*b.c,b:a.a*b.b+a.b*b.d,c:a.c*b.a+a.d*b.c,d:a.c*b.b+a.d*b.d,e:a.e*b.a+a.f*b.c+b.e,f:a.e*b.b+a.f*b.d+b.f};}
function txPt(x,y,ct){return{x:ct.a*x+ct.c*y+ct.e,y:ct.b*x+ct.d*y+ct.f};}
const I={a:1,b:0,c:0,d:1,e:0,f:0};

/* ── Full stream parser — extract all segments with absolute coords ── */
function parseStreamFull(st){
  const lines=st.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  const segments=[];
  const ctmStack=[{...I}];
  let ctm={...I};
  let color='#fff',lineWidth=1,layerName='Default',isDashed=false;
  let curPath=[];  // [{op,x,y,...}] in absolute coords
  let curPathRaw=[]; // original text lines for this path

  const PR=/^(-?\d[\d.]*\s+){1,6}[mlcvy]$/;
  const RR=/^(-?\d[\d.]*\s+){3,4}re$/;

  function flushPath(paintOp){
    if(!curPath.length){curPathRaw=[];return;}
    const isFill=paintOp==='f'||paintOp==='F'||paintOp==='f*'||paintOp==='B'||paintOp==='B*';
    const isStroke=paintOp==='S'||paintOp==='s'||paintOp==='B'||paintOp==='B*';
    // Extract subpaths (split on m)
    const subpaths=[];let cur=[];
    for(const pt of curPath){
      if(pt.op==='m'){if(cur.length)subpaths.push(cur);cur=[pt];}
      else cur.push(pt);
    }
    if(cur.length)subpaths.push(cur);
    for(const sp of subpaths){
      if(sp.length<2)continue;
      const absPoints=sp.map(p=>({op:p.op,x:p.x,y:p.y,x1:p.x1,y1:p.y1,x2:p.x2,y2:p.y2}));
      segments.push({absPoints,color,lineWidth,layerName,isFill,isStroke,isDashed,origPathText:curPathRaw.join('\n')});
    }
    curPath=[];curPathRaw=[];
  }

  for(let i=0;i<lines.length;i++){
    const t=lines[i].trim();if(!t)continue;
    const parts=t.split(/\s+/);
    const op=parts[parts.length-1];

    // Graphics state
    if(op==='q'){ctmStack.push({...ctm});continue;}
    if(op==='Q'){if(ctmStack.length>1)ctm=ctmStack.pop();continue;}
    if(op==='cm'&&parts.length>=7){
      const nc={a:+parts[0],b:+parts[1],c:+parts[2],d:+parts[3],e:+parts[4],f:+parts[5]};
      ctm=mulCTM(nc,ctm);continue;
    }

    // Color
    if(op==='K'&&parts.length>=5){const[c,m2,y,k]=[+parts[0],+parts[1],+parts[2],+parts[3]];color=`rgb(${Math.round(255*(1-c)*(1-k))},${Math.round(255*(1-m2)*(1-k))},${Math.round(255*(1-y)*(1-k))})`;}
    if(op==='SCN'||op==='scn')color='#ff00ff';
    if(op==='RG'&&parts.length>=4)color=`rgb(${Math.round(+parts[0]*255)},${Math.round(+parts[1]*255)},${Math.round(+parts[2]*255)})`;
    if(op==='w'&&parts.length>=2)lineWidth=+parts[0];
    if(op==='d')isDashed=t.includes('[')&&!t.includes('[]');

    // Layer
    const bdc=t.match(/^\/OC\s+(\/\w+)\s+BDC/);if(bdc)layerName=bdc[1].slice(1);

    // Clipping rect — skip
    if(RR.test(t)){
      let isClip=false;
      for(let j=i+1;j<lines.length;j++){const nt=lines[j].trim();if(!nt)continue;if(/^W\*?\s*(n)?$/.test(nt))isClip=true;break;}
      if(isClip)continue;
    }

    // Path ops — transform to absolute coordinates
    if(op==='m'&&parts.length>=3){
      // New subpath within current path
      const p=txPt(+parts[0],+parts[1],ctm);
      curPath.push({op:'m',x:p.x,y:p.y});curPathRaw.push(lines[i]);continue;
    }
    if(op==='l'&&parts.length>=3){const p=txPt(+parts[0],+parts[1],ctm);curPath.push({op:'l',x:p.x,y:p.y});curPathRaw.push(lines[i]);continue;}
    if(op==='c'&&parts.length>=7){
      const p1=txPt(+parts[0],+parts[1],ctm),p2=txPt(+parts[2],+parts[3],ctm),p3=txPt(+parts[4],+parts[5],ctm);
      curPath.push({op:'c',x:p3.x,y:p3.y,x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y});curPathRaw.push(lines[i]);continue;
    }
    if(op==='h'){if(curPath.length)curPath.push({op:'h',x:curPath[0].x,y:curPath[0].y});curPathRaw.push(lines[i]);continue;}

    // Paint ops
    if(op==='S'||op==='s'){flushPath('S');continue;}
    if(op==='f'||op==='F'||op==='f*'){flushPath('f');continue;}
    if(op==='B'||op==='B*'||op==='b'||op==='b*'){flushPath('B');continue;}
    if(op==='n'){curPath=[];curPathRaw=[];continue;} // discard (clipping)
  }
  return segments;
}

/* ── Endpoint-based chaining across all segments ── */
function gS(pts){return{x:pts[0].x,y:pts[0].y};}
function gE(pts){const l=pts[pts.length-1];return{x:l.x,y:l.y};}
function pD(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2);}

function reversePoints(pts){
  if(pts.length<=1)return[...pts];
  const e=gE(pts);const r=[{op:'m',x:e.x,y:e.y}];
  for(let i=pts.length-1;i>=1;i--){
    const s=pts[i],p=pts[i-1];
    if(s.op==='c')r.push({op:'c',x:p.x,y:p.y,x1:s.x2,y1:s.y2,x2:s.x1,y2:s.y1});
    else r.push({op:'l',x:p.x,y:p.y});
  }
  return r;
}

function weldSegments(segments,tol){
  // Only weld stroked, non-fill, non-dashed segments
  const strokeSegs=[], otherSegs=[];
  for(const seg of segments){
    if(seg.isStroke&&!seg.isFill&&!seg.isDashed&&seg.absPoints.length>=2)
      strokeSegs.push(seg);
    else otherSegs.push(seg);
  }

  if(strokeSegs.length<=1)return{chains:strokeSegs.map(s=>({absPoints:s.absPoints,color:s.color,lineWidth:s.lineWidth,layerName:s.layerName,closed:false})),others:otherSegs,joins:0};

  // Endpoint map for fast lookup
  const key=p=>`${Math.round(p.x*100)/100},${Math.round(p.y*100)/100}`;
  const endMap=new Map();
  strokeSegs.forEach((seg,i)=>{
    const addKey=(p,isStart)=>{const k=key(p);if(!endMap.has(k))endMap.set(k,[]);endMap.get(k).push({idx:i,isStart});};
    addKey(gS(seg.absPoints),true);
    addKey(gE(seg.absPoints),false);
  });

  const used=new Set();
  const chains=[];
  let joins=0;

  for(let i=0;i<strokeSegs.length;i++){
    if(used.has(i))continue;
    used.add(i);
    let chain=[...strokeSegs[i].absPoints];
    let chainColor=strokeSegs[i].color;
    let chainLW=strokeSegs[i].lineWidth;
    let chainLayer=strokeSegs[i].layerName;

    // Grow forward
    let changed=true;
    while(changed){
      changed=false;
      const ce=gE(chain);
      const candidates=endMap.get(key(ce))||[];
      for(const c of candidates){
        if(used.has(c.idx))continue;
        const seg=strokeSegs[c.idx];
        // Double-check distance with actual coords
        const matchPt=c.isStart?gS(seg.absPoints):gE(seg.absPoints);
        if(pD(ce,matchPt)>tol)continue;
        if(c.isStart){
          chain=chain.concat(seg.absPoints.slice(1));
        } else {
          chain=chain.concat(reversePoints(seg.absPoints).slice(1));
        }
        used.add(c.idx);changed=true;joins++;break;
      }
    }
    // Grow backward
    changed=true;
    while(changed){
      changed=false;
      const cs=gS(chain);
      const candidates=endMap.get(key(cs))||[];
      for(const c of candidates){
        if(used.has(c.idx))continue;
        const seg=strokeSegs[c.idx];
        const matchPt=c.isStart?gS(seg.absPoints):gE(seg.absPoints);
        if(pD(cs,matchPt)>tol)continue;
        if(!c.isStart){
          chain=[...seg.absPoints,...chain.slice(1)];
        } else {
          chain=[...reversePoints(seg.absPoints),...chain.slice(1)];
        }
        used.add(c.idx);changed=true;joins++;break;
      }
    }

    // Check if closed
    const closed=pD(gS(chain),gE(chain))<=tol;
    chains.push({absPoints:chain,color:chainColor,lineWidth:chainLW,layerName:chainLayer,closed});
  }

  // Any unused stroke segs
  for(let i=0;i<strokeSegs.length;i++){
    if(!used.has(i)){
      const s=strokeSegs[i];
      chains.push({absPoints:s.absPoints,color:s.color,lineWidth:s.lineWidth,layerName:s.layerName,closed:false});
    }
  }

  return{chains,others:otherSegs,joins};
}

/* ── SVG ── */
function renderSegments(svg,items,showNum){
  svg.innerHTML='';if(!pageMediaBox)return;
  const[mx,my,mw,mh]=pageMediaBox;
  svg.setAttribute('viewBox',`${mx} ${-mh} ${mw-mx} ${mh-my}`);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  const colors=['#38bdf8','#f472b6','#4ade80','#fbbf24','#a78bfa','#fb923c','#e879f9','#22d3ee','#f97316','#84cc16'];
  items.forEach((item,si)=>{
    const pts=item.absPoints;if(!pts||!pts.length)return;
    let d='';
    for(const p of pts){
      if(p.op==='m')d+=`M${p.x.toFixed(2)} ${(-p.y).toFixed(2)} `;
      else if(p.op==='l'||p.op==='h')d+=`L${p.x.toFixed(2)} ${(-p.y).toFixed(2)} `;
      else if(p.op==='c')d+=`C${p.x1.toFixed(2)} ${(-p.y1).toFixed(2)} ${p.x2.toFixed(2)} ${(-p.y2).toFixed(2)} ${p.x.toFixed(2)} ${(-p.y).toFixed(2)} `;
    }
    if(item.closed)d+='Z ';
    if(!d.trim())return;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',d);path.setAttribute('fill','none');
    path.setAttribute('stroke',showNum?colors[si%colors.length]:(item.color||'#fff'));
    path.setAttribute('stroke-width',showNum?'1.5':'1.2');
    if(item.isDashed)path.setAttribute('stroke-dasharray','8 4');
    svg.appendChild(path);
    if(showNum&&pts.length>=2){
      const st=gS(pts),en=gE(pts);
      [[st,'#4ade80'],[en,'#f87171']].forEach(([pt,fill])=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',pt.x.toFixed(2));c.setAttribute('cy',(-pt.y).toFixed(2));c.setAttribute('r','3');c.setAttribute('fill',fill);svg.appendChild(c);});
      const mid=pts[Math.floor(pts.length/2)];
      const lbl=document.createElementNS('http://www.w3.org/2000/svg','text');
      lbl.setAttribute('x',mid.x.toFixed(2));lbl.setAttribute('y',(-(mid.y)+8).toFixed(2));
      lbl.setAttribute('fill',colors[si%colors.length]);lbl.setAttribute('font-size','8');lbl.setAttribute('text-anchor','middle');
      lbl.textContent=`${si}`;svg.appendChild(lbl);
    }
  });
}

/* ── PDF Export ── */
function fmt(n){const s=n.toFixed(4);return s.replace(/\.?0+$/,'')||'0';}

async function exportWeldedPDF(){
  if(!pdfBytes||(!weldedChains.length&&!unweldedSegs.length))return;
  log('Building welded PDF...','info');

  /* Build new content stream from scratch — one path per chain */
  const streamLines=[];

  // Group by layer
  const layers=new Map();
  const allItems=[...weldedChains,...unweldedSegs.map(s=>({absPoints:s.absPoints,color:s.color,lineWidth:s.lineWidth,layerName:s.layerName,closed:false,isFill:s.isFill,isDashed:s.isDashed}))];

  // Collect unique layer names in order
  const layerOrder=[];const seen=new Set();
  for(const item of allItems){if(!seen.has(item.layerName)){seen.add(item.layerName);layerOrder.push(item.layerName);}}

  for(const ln of layerOrder){
    const layerItems=allItems.filter(it=>it.layerName===ln);
    // Find OC reference name from original stream
    const ocMatch=origStreamText.match(new RegExp(`/OC\\s+(/\\w+)\\s+BDC[\\s\\S]*?${ln.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}`));
    const ocName=origStreamText.match(/\/OC\s+(\/\w+)\s+BDC/);
    // Just use layer markers from original
    const bdcMatch=origStreamText.match(new RegExp(`/OC\\s+(/\\w+)\\s+BDC`,'g'));

    for(const item of layerItems){
      streamLines.push('q');
      // Set color
      if(item.color&&item.color.startsWith('rgb')){
        const m=item.color.match(/(\d+)/g);
        if(m&&m.length>=3){
          const[r,g,b]=[+m[0]/255,+m[1]/255,+m[2]/255];
          // Convert to CMYK approx
          const k2=1-Math.max(r,g,b);
          if(k2<1){const c2=(1-r-k2)/(1-k2),m2=(1-g-k2)/(1-k2),y2=(1-b-k2)/(1-k2);
            streamLines.push(`${fmt(c2)} ${fmt(m2)} ${fmt(y2)} ${fmt(k2)} K`);}
          else streamLines.push('0 0 0 1 K');
        }
      }
      streamLines.push(`${fmt(item.lineWidth)} w`);
      if(item.isDashed)streamLines.push('[18 9] 0 d');
      streamLines.push('1 j 1 J'); // round join + cap

      // Emit path in absolute coords (identity CTM)
      for(const p of item.absPoints){
        if(p.op==='m')streamLines.push(`${fmt(p.x)} ${fmt(p.y)} m`);
        else if(p.op==='l')streamLines.push(`${fmt(p.x)} ${fmt(p.y)} l`);
        else if(p.op==='h')streamLines.push('h');
        else if(p.op==='c')streamLines.push(`${fmt(p.x1)} ${fmt(p.y1)} ${fmt(p.x2)} ${fmt(p.y2)} ${fmt(p.x)} ${fmt(p.y)} c`);
      }
      if(item.closed)streamLines.push('h');
      if(item.isFill)streamLines.push('f');
      else streamLines.push('S');
      streamLines.push('Q');
    }
  }

  const newStream=streamLines.join('\n');
  log(`New stream: ${newStream.length} chars`,'info');
  const origMoves=(origStreamText.match(/[\d.]+\s+[\d.-]+\s+m/g)||[]).length;
  const newMoves=(newStream.match(/[\d.]+\s+[\d.-]+\s+m/g)||[]).length;
  log(`Moveto ops: ${origMoves} → ${newMoves}`,origMoves!==newMoves?'success':'warn');

  /* Write PDF with pdf-lib */
  const doc=await PDFLib.PDFDocument.load(pdfBytes.slice(0),{ignoreEncryption:true});
  const page=doc.getPages()[0];

  // Encode as latin-1 bytes
  const newBytes=new Uint8Array(newStream.length);
  for(let i=0;i<newStream.length;i++)newBytes[i]=newStream.charCodeAt(i)&0xFF;

  const ns=doc.context.flateStream(newBytes);
  const nr=doc.context.register(ns);
  page.node.set(PDFLib.PDFName.of('Contents'),nr);

  // Strip Illustrator private data
  const pi=page.node.get(PDFLib.PDFName.of('PieceInfo'));
  if(pi){page.node.delete(PDFLib.PDFName.of('PieceInfo'));log('Stripped Illustrator private data','success');}

  const saved=await doc.save({useObjectStreams:false});
  const blob=new Blob([saved],{type:'application/pdf'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='welded_'+(currentFileName||'output')+'.pdf';a.click();URL.revokeObjectURL(url);
  log(`Exported: ${a.download} (${saved.length} bytes)`,'success');
}

/* ── UI ── */
const dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput');
const resultsArea=document.getElementById('resultsArea'),statsBar=document.getElementById('statsBar');
const tolSlider=document.getElementById('tolerance'),tolValue=document.getElementById('tolValue');
const btnWeld=document.getElementById('btnWeld'),btnExport=document.getElementById('btnExport');
dropZone.addEventListener('click',()=>fileInput.click());
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('dragover');});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('dragover');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);});
fileInput.addEventListener('change',e=>{if(e.target.files.length)handleFile(e.target.files[0]);});
tolSlider.addEventListener('input',()=>{tolValue.textContent=`${tolSlider.value} pt`;});
btnWeld.addEventListener('click',runWeld);
btnExport.addEventListener('click',exportWeldedPDF);

async function handleFile(file){
  currentFileName=file.name.replace(/\.pdf$/i,'');
  log(`Loading: ${file.name}`,'info');
  pdfBytes=new Uint8Array(await file.arrayBuffer());parsePDF();
}
function parsePDF(){
  const text=new TextDecoder('latin1').decode(pdfBytes.slice(0));
  const mb=text.match(/\/MediaBox\s*\[\s*([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s*\]/);
  pageMediaBox=mb?mb.slice(1,5).map(Number):[0,0,612,792];
  log(`Page: ${pageMediaBox[2]}×${pageMediaBox[3]} pt`,'info');
  origStreamText=findDrawingStream(pdfBytes);
  if(!origStreamText){log('No vector content found!','error');return;}
  log(`Drawing stream: ${origStreamText.length} chars`,'success');
  parsedSegments=parseStreamFull(origStreamText);
  const strokes=parsedSegments.filter(s=>s.isStroke&&!s.isFill);
  const fills=parsedSegments.filter(s=>s.isFill);
  log(`  ${strokes.length} stroke segment(s), ${fills.length} fill(s)`,'info');
  resultsArea.classList.remove('hidden');dropZone.classList.add('hidden');
  renderSegments(document.getElementById('svgBefore'),parsedSegments,true);
  document.getElementById('svgAfter').innerHTML='<text x="50%" y="50%" text-anchor="middle" fill="#666" font-size="14">Click "Weld Paths"</text>';
  updateStats(parsedSegments.length,0,0);btnWeld.disabled=false;btnExport.disabled=true;
}
function updateStats(b,a,j){
  statsBar.innerHTML=`<div class="stat-card before"><div class="label">Before</div><div class="value">${b}</div><div class="detail">segments</div></div>
  <div class="stat-card after"><div class="label">After</div><div class="value">${a||'—'}</div><div class="detail">continuous paths</div></div>
  <div class="stat-card savings"><div class="label">Joins Made</div><div class="value">${j||'—'}</div><div class="detail">segments connected</div></div>`;
}
function runWeld(){
  const tol=parseFloat(tolSlider.value);log(`Welding with tolerance ${tol} pt...`,'info');
  const result=weldSegments(parsedSegments,tol);
  weldedChains=result.chains;unweldedSegs=result.others;
  const totalAfter=weldedChains.length+unweldedSegs.length;
  log(`  Strokes: ${parsedSegments.filter(s=>s.isStroke&&!s.isFill).length} → ${weldedChains.length} path(s) (${result.joins} joins)`,'success');
  weldedChains.forEach((ch,i)=>{if(ch.closed)log(`    Chain ${i}: CLOSED loop (${ch.absPoints.length} points)`,'success');});
  log(`  Total: ${parsedSegments.length} → ${totalAfter}`,'success');
  updateStats(parsedSegments.length,totalAfter,result.joins);
  const allForRender=[...weldedChains,...unweldedSegs.map(s=>({absPoints:s.absPoints,color:s.color,lineWidth:s.lineWidth,isDashed:s.isDashed}))];
  renderSegments(document.getElementById('svgAfter'),allForRender,true);
  btnExport.disabled=false;
}

/* ── Auto-load ── */
const params=new URLSearchParams(window.location.search);
const autoFile=params.get('file');
if(autoFile){log(`Auto-loading: ${autoFile}`,'info');
  (async()=>{try{const r=await fetch(autoFile);if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const buf=await r.arrayBuffer();currentFileName=autoFile.split('/').pop().replace(/\.pdf$/i,'');
    pdfBytes=new Uint8Array(buf);parsePDF();}catch(e){log(`Auto-load failed: ${e.message}`,'error');}})();
}
</script>
